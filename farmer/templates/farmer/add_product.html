{% extends "master.html" %}
{% load static %}

{% block body %}
<style>
.add-product-wrap{background:#f5f7f2;min-height:70vh;}
.add-product-card{
    background:#fff;border:1px solid #e4ede0;border-radius:16px;
    box-shadow:0 6px 24px rgba(34,85,34,0.08);padding:2.5rem;
}
.add-product-card h3{
    font-family:var(--font-heading);font-weight:800;color:var(--ink);
    margin-bottom:.35rem;
}
.add-product-subtitle{color:#6c757d;font-size:.92rem;margin-bottom:2rem;}
.product-form p{margin-bottom:1.15rem;}
.product-form label{
    display:block;font-weight:600;font-size:.85rem;color:#2d4a2d;
    margin-bottom:.35rem;letter-spacing:.2px;
}
.product-form input[type="text"],
.product-form input[type="number"],
.product-form input[type="email"],
.product-form input[type="url"],
.product-form input[type="file"],
.product-form select,
.product-form textarea{
    width:100%;padding:.65rem .9rem;border:1.5px solid #d4e6cc;
    border-radius:10px;font-size:.95rem;color:#2f2f2f;background:#fbfdf9;
    transition:border-color .2s ease, box-shadow .2s ease;
}
.product-form input:focus,
.product-form select:focus,
.product-form textarea:focus{
    outline:none;border-color:#2e7d32;box-shadow:0 0 0 3px rgba(46,125,50,0.12);
    background:#fff;
}
.product-form textarea{min-height:110px;resize:vertical;}
.product-form .helptext{display:block;font-size:.78rem;color:#8a998a;margin-top:.3rem;}
.product-form ul.errorlist{
    list-style:none;padding:0;margin:.3rem 0 0;color:#c0392b;font-size:.82rem;
}
.add-product-actions{
    display:flex;gap:.75rem;justify-content:center;margin-top:1.75rem;
    padding-top:1.5rem;border-top:1px solid #eef3ea;
}
</style>

<div class="container-fluid add-product-wrap py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-9">

                <div class="add-product-card">
                    <h3>Add New Product</h3>
                    <p class="add-product-subtitle">List a fresh product for buyers to discover in your shop.</p>

                    <form class="product-form" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="add-product-actions">
                            <button type="submit" class="btn btn-success rounded-pill px-4">
                                <i class="fa fa-check me-1"></i> Save Product
                            </button>
                            <a href="{% url 'farmer_dashboard' %}"
                               class="btn btn-outline-secondary rounded-pill px-4">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
